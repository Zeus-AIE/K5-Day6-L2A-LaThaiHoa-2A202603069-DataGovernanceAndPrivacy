# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G06                     # e.g. G07
owner: "La Thai Hoa (Release Gate Owner / Data Steward)"   # mandatory for every Decision
track_config: tracks/t06.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t06                        # must match track_config
input: fixtures/t06_release_gate  # or data/real/... if your instructor provided a real pack
output: out/
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
params:
  parent_release: releases/v1.0
  budget: 10
  max_benign_jitter_px: 2.0
  max_mean_shift_px: 1.5
  roundtrip_tol_px: 0.5
